name: SAST - SonarCloud with Kotlin coverage

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        type: string
        default: '17'
      gradle_command:
        required: false
        type: string
        default: './gradlew clean test koverXmlReport'
      kover_report_path:
        required: false
        type: string
        default: 'build/reports/kover/report.xml'
      sources:
        required: false
        type: string
        default: 'src/main'
      tests:
        required: false
        type: string
        default: 'src/test'
      java_binaries:
        required: false
        type: string
        default: 'build/classes/kotlin/'
      kotlin_binaries:
        required: false
        type: string
        default: 'build/classes/kotlin/'
      extra_sonar_args:
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

jobs:

  check_secret:
    name: Check secret presence
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "SONAR_TOKEN missing, stopping workflow"
            exit 1
          else
            echo "SONAR_TOKEN exists, continuing workflow"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage:
    name: Kotlin coverage
    needs: check_secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      SONAR_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.pull_request != null }}

      - name: Run tests and Kover report
        run: ${{ inputs.gradle_command }}
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Upload Kover report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-kover-report
          path: ${{ inputs.kover_report_path }}
          if-no-files-found: error

      - name: Upload Kotlin binaries
        uses: actions/upload-artifact@v4
        with:
          name: sonar-kotlin-binaries
          path: ${{ inputs.kotlin_binaries }}
          if-no-files-found: warn

  analyze:
    name: SAST - SonarCloud analysis
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate pull request refs
        if: ${{ github.event.pull_request }}
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          for name in PR_HEAD_REF PR_BASE_REF; do
            val="${!name}"
            if [[ ! "$val" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Refusing illegal git ref in ${name}"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          allow-unsafe-pr-checkout: true

      - name: Download Kover report
        uses: actions/download-artifact@v4
        with:
          name: sonar-kover-report
          path: kover-artifact

      - name: Download Kotlin binaries
        uses: actions/download-artifact@v4
        with:
          name: sonar-kotlin-binaries
          path: ${{ inputs.kotlin_binaries }}
        continue-on-error: true

      - name: Place Kover report
        env:
          KOVER_PATH: ${{ inputs.kover_report_path }}
        run: |
          set -euo pipefail
          if [[ "$KOVER_PATH" == /* || "$KOVER_PATH" == *..* ]]; then
            echo "Refusing unsafe kover_report_path"
            exit 1
          fi
          mkdir -p "$(dirname "$KOVER_PATH")"
          SRC=$(find kover-artifact -type f -name '*.xml' | head -n 1)
          if [[ -z "$SRC" ]]; then
            echo "Kover XML not found in artifact"
            exit 1
          fi
          cp "$SRC" "$KOVER_PATH"

      - name: Strip dangerous scanner settings
        run: |
          set -euo pipefail
          rm -rf .scannerwork
          while IFS= read -r -d '' f; do
            grep -viE '^([[:space:]]*)(sonar\.host\.url|sonar\.login|sonar\.token|sonar\.password|sonar\.scanner)([.=]|$)' "$f" > "$f.safe" || true
            mv "$f.safe" "$f"
          done < <(find . \( -name 'sonar-project.properties' -o -name '.sonarcloud.properties' -o -name 'sonar-scanner.properties' \) -print0)

      - name: setup projectkey
        run: echo "PROJECTKEY=${{ github.repository_owner}}_$(echo ${{ github.repository }} | sed 's/.*\///')" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: SonarCloud Scan - Push / Workflow Dispatch
        if: ${{ !github.event.pull_request }}
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ env.PROJECTKEY }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.language=kotlin
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.kover_report_path }}
            -Dsonar.kotlin.coverage.reportPaths=${{ inputs.kover_report_path }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.tests=${{ inputs.tests }}
            -Dsonar.java.binaries=${{ inputs.java_binaries }}
            -Dsonar.kotlin.binaries=${{ inputs.kotlin_binaries }}
            ${{ inputs.extra_sonar_args }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan - Pull Request
        if: ${{ github.event.pull_request }}
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ env.PROJECTKEY }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.language=kotlin
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.kover_report_path }}
            -Dsonar.kotlin.coverage.reportPaths=${{ inputs.kover_report_path }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.tests=${{ inputs.tests }}
            -Dsonar.java.binaries=${{ inputs.java_binaries }}
            -Dsonar.kotlin.binaries=${{ inputs.kotlin_binaries }}
            ${{ inputs.extra_sonar_args }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
