name: SAST - SonarCloud with Kotlin coverage (Kotlin Libs)

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        type: string
        default: '17'
      gradle_command:
        required: false
        type: string
        default: './gradlew clean test koverXmlReport'
      kover_report_path:
        required: false
        type: string
        default: 'build/reports/kover/report.xml'
      sources:
        required: false
        type: string
        default: 'src/main'
      tests:
        required: false
        type: string
        default: 'src/test'
      java_binaries:
        required: false
        type: string
        default: 'build/classes/kotlin/'
      kotlin_binaries:
        required: false
        type: string
        default: 'build/classes/kotlin/'
      extra_sonar_args:
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

jobs:

  check_secret:
    name: Check secret presence
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "SONAR_TOKEN missing, stopping workflow"
            exit 1
          else
            echo "SONAR_TOKEN exists, continuing workflow"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage:
    name: Kotlin coverage
    needs: check_secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      SONAR_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.pull_request != null }}

      - name: Run tests and Kover report
        run: ${{ inputs.gradle_command }}
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Upload Kover report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-kover-report
          path: ${{ inputs.kover_report_path }}
          if-no-files-found: error

      - name: Upload Kotlin binaries
        uses: actions/upload-artifact@v4
        with:
          name: sonar-kotlin-binaries
          path: ${{ inputs.kotlin_binaries }}
          if-no-files-found: warn

  analyze:
    name: SAST - SonarCloud analysis
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate pull request refs
        if: ${{ github.event.pull_request }}
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          for name in PR_HEAD_REF PR_BASE_REF; do
            val="${!name}"
            if [[ ! "$val" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Refusing illegal git ref in ${name}"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          allow-unsafe-pr-checkout: true

      - name: Download Kover report
        uses: actions/download-artifact@v4
        with:
          name: sonar-kover-report
          path: kover-artifact

      - name: Download Kotlin binaries
        uses: actions/download-artifact@v4
        with:
          name: sonar-kotlin-binaries
          path: ${{ inputs.kotlin_binaries }}
        continue-on-error: true

      - name: Place Kover report
        env:
          KOVER_PATH: ${{ inputs.kover_report_path }}
        run: |
          set -euo pipefail
          if [[ "$KOVER_PATH" == /* || "$KOVER_PATH" == *..* ]]; then
            echo "Refusing unsafe kover_report_path"
            exit 1
          fi
          mkdir -p "$(dirname "$KOVER_PATH")"
          SRC=$(find kover-artifact -type f -name '*.xml' | head -n 1)
          if [[ -z "$SRC" ]]; then
            echo "Kover XML not found in artifact"
            exit 1
          fi
          cp "$SRC" "$KOVER_PATH"

      - name: Strip dangerous scanner settings
        run: |
          set -euo pipefail
          rm -rf .scannerwork
          while IFS= read -r -d '' f; do
            grep -viE '^([[:space:]]*)(sonar\.host\.url|sonar\.login|sonar\.token|sonar\.password|sonar\.scanner)([.=]|$)' "$f" > "$f.safe" || true
            mv "$f.safe" "$f"
          done < <(find . \( -name 'sonar-project.properties' -o -name '.sonarcloud.properties' -o -name 'sonar-scanner.properties' \) -print0)

      - name: setup projectkey
        run: echo "PROJECTKEY=${{ github.repository_owner}}_$(echo ${{ github.repository }} | sed 's/.*\///')" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: SonarCloud Scan - Push / Workflow Dispatch
        if: ${{ !github.event.pull_request }}
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ env.PROJECTKEY }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.language=kotlin
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.kover_report_path }}
            -Dsonar.kotlin.coverage.reportPaths=${{ inputs.kover_report_path }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.tests=${{ inputs.tests }}
            -Dsonar.java.binaries=${{ inputs.java_binaries }}
            -Dsonar.kotlin.binaries=${{ inputs.kotlin_binaries }}
            ${{ inputs.extra_sonar_args }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan - Pull Request
        if: ${{ github.event.pull_request }}
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ env.PROJECTKEY }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.language=kotlin
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.kover_report_path }}
            -Dsonar.kotlin.coverage.reportPaths=${{ inputs.kover_report_path }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.tests=${{ inputs.tests }}
            -Dsonar.java.binaries=${{ inputs.java_binaries }}
            -Dsonar.kotlin.binaries=${{ inputs.kotlin_binaries }}
            ${{ inputs.extra_sonar_args }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  comment:
    name: Post SonarCloud PR comment
    needs: analyze
    if: ${{ github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECTKEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MARKER: "<!-- sonarcloud-pr-report -->"
      PYTHONSAFEPATH: "1"
    steps:
      - name: Fetch Sonar results and upsert comment
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          SONAR_URL="https://sonarcloud.io"
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "invalid PR number"
            exit 1
          fi

          for i in $(seq 1 36); do
            curl -fsS -u "${SONAR_TOKEN}:" \
              "${SONAR_URL}/api/qualitygates/project_status?projectKey=${PROJECTKEY}&pullRequest=${PR_NUMBER}" \
              > qg.json || echo '{}' > qg.json
            STATUS=$(python3 -I -c 'import json; print((json.load(open("qg.json")).get("projectStatus") or {}).get("status") or "")')
            echo "Quality gate status: ${STATUS}"
            if [[ -n "${STATUS}" && "${STATUS}" != "NONE" ]]; then
              break
            fi
            sleep 5
          done

          curl -fsS -u "${SONAR_TOKEN}:" \
            "${SONAR_URL}/api/measures/component?component=${PROJECTKEY}&pullRequest=${PR_NUMBER}&metricKeys=bugs,vulnerabilities,code_smells,coverage,security_hotspots,duplicated_lines_density" \
            > measures.json || echo '{}' > measures.json
          curl -fsS -u "${SONAR_TOKEN}:" \
            "${SONAR_URL}/api/issues/search?componentKeys=${PROJECTKEY}&pullRequest=${PR_NUMBER}&ps=10&s=SEVERITY&asc=false" \
            > issues.json || echo '{}' > issues.json

          export DASHBOARD_URL="${SONAR_URL}/summary/new_code?id=${PROJECTKEY}&pullRequest=${PR_NUMBER}"
          python3 -I - <<'PY'
          import json, os, re, subprocess

          marker = os.environ["MARKER"]
          dashboard = os.environ["DASHBOARD_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          if not re.fullmatch(r"[0-9]+", pr):
              raise SystemExit("invalid PR number")

          def load(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def sanitize(value, limit=240):
              text = re.sub(r"[\r\n]+", " ", str(value))
              text = re.sub(r"[`<>\[\]()]", "", text)
              text = re.sub(r"(^|[^a-zA-Z0-9_])@", r"\1", text)
              text = re.sub(r"https?://\S+", "", text)
              return text[:limit]

          qg = load("qg.json")
          measures_raw = load("measures.json")
          issues_raw = load("issues.json")
          status = sanitize((qg.get("projectStatus") or {}).get("status") or "UNKNOWN", 32)
          emoji = {"OK": "✅", "ERROR": "❌", "WARN": "⚠️"}.get(status, "ℹ️")

          measures = {}
          for m in (measures_raw.get("component") or {}).get("measures") or []:
              if not isinstance(m, dict):
                  continue
              value = m.get("value")
              if value is None:
                  value = (m.get("period") or {}).get("value", "n/a")
              measures[m.get("metric")] = sanitize(value, 32)

          def metric(name):
              return measures.get(name, "n/a")

          lines = [
              marker,
              "## SonarCloud analysis",
              "",
              f"{emoji} Quality Gate: **{status}**",
              "",
              f"[Open in SonarCloud]({dashboard})",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Bugs | {metric('bugs')} |",
              f"| Vulnerabilities | {metric('vulnerabilities')} |",
              f"| Security hotspots | {metric('security_hotspots')} |",
              f"| Code smells | {metric('code_smells')} |",
              f"| Coverage | {metric('coverage')} |",
              f"| Duplicated lines | {metric('duplicated_lines_density')} |",
              "",
              f"Open issues on this PR: **{sanitize(issues_raw.get('total', 'n/a'), 16)}**",
              "",
          ]
          issues = issues_raw.get("issues") or []
          if issues:
              lines += ["### Top issues", ""]
              for issue in issues[:10]:
                  sev = sanitize(issue.get("severity", ""), 16)
                  itype = sanitize(issue.get("type", ""), 32)
                  msg = sanitize(issue.get("message") or "")
                  comp = issue.get("component") or ""
                  path = sanitize(comp.split(":", 1)[-1], 160)
                  line = issue.get("line")
                  loc = f"{path}:{line}" if isinstance(line, int) else path
                  lines.append(f"- **{sev}** `{itype}` {msg} ({loc})")
              lines.append("")
          lines.append("_Updated on each analysis._")
          body = "\n".join(lines)

          def gh_api(method, path, payload=None):
              cmd = ["gh", "api", "-X", method, path]
              inp = None
              if payload is not None:
                  cmd += ["--input", "-"]
                  inp = json.dumps(payload)
              result = subprocess.run(cmd, input=inp, capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None

          raw = subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp", f"repos/{repo}/issues/{pr}/comments"],
              text=True,
          )
          parsed = json.loads(raw) if raw.strip() else []
          comments = []
          if parsed and isinstance(parsed, list) and parsed and isinstance(parsed[0], list):
              for page in parsed:
                  comments.extend(page)
          elif isinstance(parsed, list):
              comments = parsed

          comment_id = None
          for comment in comments:
              if marker in (comment.get("body") or ""):
                  comment_id = comment["id"]
                  break
          payload = {"body": body}
          if comment_id:
              gh_api("PATCH", f"repos/{repo}/issues/comments/{comment_id}", payload)
          else:
              gh_api("POST", f"repos/{repo}/issues/{pr}/comments", payload)
          PY
